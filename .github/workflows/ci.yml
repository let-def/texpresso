name: CI TeXpresso – build & test

on:
  push:
    branches: [eclipse, detectonic, main, detectonic-ci]
  pull_request:
    branches: [eclipse, detectonic, main, detectonic-ci]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            os: ubuntu-24.04
            container: ''
            install: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                build-essential libsdl2-dev libmupdf-dev libmujs-dev \
                libfreetype-dev libgumbo-dev libjbig2dec0-dev libjpeg-dev \
                libopenjp2-7-dev libssl-dev libfontconfig-dev libleptonica-dev \
                libharfbuzz-dev mupdf snapd \
                texlive-xetex texlive-latex-recommended texlive-extra-utils
              sudo snap install tectonic

          - label: macos
            os: macos-14
            container: ''
            install: |
              brew update
              brew install gcc mupdf-tools sdl2 tectonic texlive

          - label: arch
            os: ubuntu-latest
            container: archlinux:latest
            install: |
              pacman -Sy --noconfirm --needed \
                base-devel gcc git curl \
                freetype2 harfbuzz icu libjpeg-turbo openjpeg2 libpng \
                gumbo-parser tesseract leptonica openssl zlib \
                sdl2 mupdf \
                texlive-bin texlive-core texlive-latexextra \
                texlive-fontsextra texlive-latexrecommended \
                tectonic texlive-fontsrecommended texlive-xetex

          - label: fedora
            os: ubuntu-latest
            container: fedora:latest
            install: |
              dnf install -y gcc gcc-c++ make rust cargo clang curl tar \
                mupdf-devel SDL2-devel freetype-devel harfbuzz-devel \
                libjpeg-turbo-devel jbig2dec-devel openjpeg2-devel \
                gumbo-parser-devel tesseract-devel leptonica-devel \
                openssl-devel fontconfig-devel graphite2-devel \
                libicu-devel zlib-devel \
                texlive-scheme-basic texlive-collection-latexrecommended \
                texlive-xetex
              curl -fsSL https://drop-sh.fullyjustified.net | sh
              mv tectonic /usr/local/bin

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v4

      - name: Install tool-chain
        run: ${{ matrix.install }}

      # The engine is a build artifact, not source: engines/ is gitignored. Cache
      # it keyed on the fetch script, which carries both the release tag and the
      # checksums — re-cutting a release therefore invalidates this by itself.
      # The cached directory also ends up holding engine.o, so warm runs skip the
      # ~1 min -O2 compile of a 45 MB engine.c.
      - name: Cache wasm engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engines/build-wasm2c-xetex
          key: engine-xetex-${{ matrix.label }}-${{ hashFiles('scripts/fetch-wasm-engine.sh') }}

      - name: Fetch wasm engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: make fetch-engine TEXPRESSO_ENGINE=xetex

      - name: Build project
        run: make all

      - name: Generate Tectonic cache
        run: make fill-tectonic-cache

      - name: Run tests – Texpresso
        run: make test-texpresso || echo "fail" > texpresso.status

      - name: Run tests – open-base64
        run: make test-open-base64 || echo "fail" > open-base64.status

      - name: Run tests – TeXpresso with TeX Live
        run: make test-texpresso-texlive || echo "fail" > texpresso-texlive.status

      - name: Run tests – TeXpresso with Tectonic
        run: make test-texpresso-tectonic || echo "fail" > texpresso-tectonic.status

      - name: Run tests – Stream mode
        run: make test-stream || echo "fail" > stream.status

      - name: Run tests – Register (deferred query)
        run: make test-register || echo "fail" > register.status

      - name: Run tests – Lookup-file (failed + restart)
        run: make test-lookup-file || echo "fail" > lookup-file.status

      - name: Run tests – Rerun (editor commands + on-demand convergence)
        run: make test-rerun || echo "fail" > rerun.status

      - name: Run tests – Replay (incremental edits stay byte-identical)
        run: make test-replay || echo "fail" > replay.status

      - name: Run tests – Fence (snapshot restore reproduces memory exactly)
        run: make test-fence || echo "fail" > fence.status

      - name: Report summary
        if: always()
        run: |
          pass=0; fail=0
          [ ! -f texpresso.status ] && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f open-base64.status ] && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f texpresso-texlive.status ]  && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f texpresso-tectonic.status ] && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f stream.status ]      && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f register.status ]    && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f lookup-file.status ] && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f rerun.status ]       && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f replay.status ]      && pass=$((pass+1)) || fail=$((fail+1))
          [ ! -f fence.status ]       && pass=$((pass+1)) || fail=$((fail+1))
          echo "Passed: $pass" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed: $fail"  >> "$GITHUB_STEP_SUMMARY"
          [ $fail -eq 0 ]

  # ABI drift check. Each engine's wasm exposes a different w2c_engine struct —
  # luatex has three mutable globals where xetex has one — and wasm_host.c once
  # hardcoded xetex's, so it could not compile against luatex at all for a week
  # without anything noticing. Building each engine catches that. The frontend
  # logic is engine-independent and already covered by the matrix above, so these
  # only need to build and typeset. One platform is enough: the ABI does not vary
  # by OS.
  engines:
    name: pdftex + luatex
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tool-chain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libsdl2-dev libmupdf-dev libmujs-dev \
            libfreetype-dev libgumbo-dev libjbig2dec0-dev libjpeg-dev \
            libopenjp2-7-dev libssl-dev libfontconfig-dev libleptonica-dev \
            libharfbuzz-dev mupdf curl \
            texlive-luatex texlive-latex-recommended texlive-extra-utils

      - name: Cache wasm engines
        id: engines-cache
        uses: actions/cache@v4
        with:
          path: |
            engines/build-wasm2c-pdftex
            engines/build-wasm2c-luatex
          key: engines-extra-${{ hashFiles('scripts/fetch-wasm-engine.sh') }}

      - name: Fetch engines
        if: steps.engines-cache.outputs.cache-hit != 'true'
        run: |
          make fetch-engine TEXPRESSO_ENGINE=pdftex
          make fetch-engine TEXPRESSO_ENGINE=luatex

      - name: Build both
        run: |
          make common
          make texpresso-pdftex
          make texpresso-luatex

      - name: Typeset with each
        run: |
          set -e
          printf '\\documentclass{article}\n\\begin{document}\nCI.\n\\end{document}\n' > /tmp/ci.tex
          for e in pdftex luatex; do
            echo "--- $e ---"
            # Match the real summary line, not the copy embedded in the log
            # protocol message — a loose pattern here passes on garbage.
            SDL_VIDEODRIVER=dummy timeout 300 build/texpresso-$e -test-initialize /tmp/ci.tex \
              | grep -aoE "Output written on [A-Za-z0-9_.-]+ \([0-9]+ pages?, [0-9]+ bytes\)" \
              | head -1 | tee /tmp/$e.out
            [ -s /tmp/$e.out ] || { echo "$e produced no output"; exit 1; }
          done
